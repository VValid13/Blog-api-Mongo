services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - ./mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: ${MONGODB_URI_DOCKER}
    depends_on:
      - mongo
